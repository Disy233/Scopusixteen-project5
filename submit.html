<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Submit Manuscript | Scopusixteen Publishing</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="site-header"></div>
  <main>
    <section class="section">
      <div class="container" style="max-width:36rem">
        <h1 class="section-title" style="margin-bottom:0.5rem">Submit Manuscript</h1>
        <p style="color:var(--slate-600);margin-bottom:1.5rem">
          In the full application authors upload files, run an AI pre-check and track status.
          This static demo shows a simplified form.
        </p>
        <form onsubmit="event.preventDefault();alert('Thank you! In the full app this would create a manuscript record and notify the editorial office.');">
          <div class="form-group">
            <label>Article title</label>
            <input type="text" required placeholder="Your manuscript title" style="width:100%;padding:0.6rem 0.75rem;border:1px solid var(--slate-300);border-radius:0.375rem" />
          </div>
          <div class="form-group">
            <label>Journal</label>
            <select required style="width:100%;padding:0.6rem 0.75rem;border:1px solid var(--slate-300);border-radius:0.375rem">
              <option value="">Select a journal…</option>
              <option>Journal of Engineering and Applied Sciences</option>
              <option>International Journal of Medical and Health Research</option>
              <option>Journal of Business, Management & Economics</option>
              <option>Advances in Environmental Science & Sustainability</option>
            </select>
          </div>
          <div class="form-group">
            <label>Abstract</label>
            <textarea rows="5" required placeholder="Paste your abstract" style="width:100%;padding:0.6rem 0.75rem;border:1px solid var(--slate-300);border-radius:0.375rem"></textarea>
          </div>
          <button type="submit" class="btn btn-primary">Submit (demo)</button>
        </form>
        <p class="mt-4" style="font-size:0.85rem;color:var(--slate-500)">
          Prefer the full workflow? Run the original Next.js project with <code>npm run dev</code>.
        </p>
      </div>
    </section>
  </main>
  <div id="site-footer"></div>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
