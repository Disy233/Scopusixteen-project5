<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in | Scopusixteen Publishing</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="site-header"></div>
  <main>
    <div class="login-wrap">
      <div class="login-card">
        <h1>Sign in</h1>
        <p class="sub">Access author, editor, reviewer or admin dashboards.</p>
        <form id="login-form">
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" required placeholder="author@scopusixteen.com" />
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" required placeholder="demo1234" />
          </div>
          <p id="login-error" class="hidden" style="color:#b91c1c;font-size:0.85rem;margin-bottom:0.75rem"></p>
          <button type="submit" class="btn btn-primary" style="width:100%">Sign in</button>
        </form>
        <div class="demo-accounts">
          <strong>Demo accounts</strong> (password <code>demo1234</code> for all):
          <ul style="margin-top:0.5rem;padding-left:1.1rem">
            <li><code>author@scopusixteen.com</code></li>
            <li><code>editor@scopusixteen.com</code></li>
            <li><code>reviewer@scopusixteen.com</code></li>
            <li><code>admin@scopusixteen.com</code></li>
          </ul>
        </div>
      </div>
    </div>
  </main>
  <div id="site-footer"></div>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
