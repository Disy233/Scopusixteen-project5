<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login – Scopusixteen Publishing</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    .login-wrapper {
      min-height: 80vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }
    .login-card {
      background: white;
      border-radius: 16px;
      padding: 48px;
      width: 100%;
      max-width: 420px;
      box-shadow: var(--shadow);
    }
    .login-card h1 {
      font-size: 28px;
      margin-bottom: 8px;
      text-align: center;
    }
    .login-card p {
      text-align: center;
      color: var(--text-light);
      margin-bottom: 32px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
      font-size: 14px;
    }
    .form-group input {
      width: 100%;
      padding: 13px 16px;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      font-size: 15px;
    }
    .form-group input:focus {
      outline: none;
      border-color: var(--accent);
    }
    .role-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 28px;
    }
    .role-tab {
      flex: 1;
      text-align: center;
      padding: 10px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      background: #f1f5f9;
      cursor: pointer;
    }
    .role-tab.active {
      background: var(--accent);
      color: white;
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <div class="container">
      <span>support@scopusixteen.com</span>
      <div>
        <a href="index.html">← Back to Home</a>
      </div>
    </div>
  </div>

  <div class="login-wrapper">
    <div class="login-card">
      <div class="logo" style="text-align:center; margin-bottom:24px; font-size:24px;">
        SCOPUSI<span>X</span>TEEN
      </div>
      <h1>Sign In</h1>
      <p>Access your author, reviewer or editor account</p>

      <div class="role-tabs">
        <div class="role-tab active">Author</div>
        <div class="role-tab">Reviewer</div>
        <div class="role-tab">Editor</div>
        <div class="role-tab">Admin</div>
      </div>

      <form>
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" placeholder="you@email.com" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" placeholder="••••••••" required>
        </div>

        <div style="display:flex; justify-content:space-between; margin-bottom:24px; font-size:14px;">
          <label><input type="checkbox" style="width:auto; margin-right:6px;"> Remember me</label>
          <a href="#" style="color:var(--accent);">Forgot password?</a>
        </div>

        <button type="submit" class="btn btn-primary" style="width:100%; padding:14px; font-size:16px;">
          Sign In
        </button>
      </form>

      <p style="text-align:center; margin-top:28px; font-size:14px; color:var(--text-light);">
        Don’t have an account? <a href="#" style="color:var(--accent); font-weight:600;">Register</a>
      </p>
    </div>
  </div>

</body>
</html>
